notes: >-
  5ire's client-library surface is a fork of the Polkadot.js API published under the @5ire npm scope, matching the
  Substrate/Polkadot-SDK core of 5ireChain. The scope is first-party (publisher contact e-mail contact@5ire.org,
  Apache-2.0, repository github.com/5ire-org) but has not been republished since December 2021 and its source
  organization github.com/5ire-org currently exposes zero public repositories. Several package-level author fields
  still carry the upstream Polkadot.js maintainer (jacogr@gmail.com), an artifact of the fork. EVM-side developers
  are directed by 5ire's own documentation to standard Ethereum libraries (ethers.js, web3.js, wagmi, Hardhat,
  Foundry, Remix) pointed at the 5ireChain JSON-RPC endpoint rather than to a 5ire-specific SDK.
