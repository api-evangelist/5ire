apis:
  - name: 5ireChain Mainnet JSON-RPC
    description: >-
      Ethereum-compatible JSON-RPC 2.0 endpoint for the 5ireChain mainnet (EIP-155 chain ID 995, native currency
      5ire, 18 decimals). Serves the standard eth_*, net_* and web3_* method families against the EVM machine that
      runs on the 5ireChain base network, so Ethereum tooling (MetaMask, Hardhat, Foundry, Remix, wagmi, ethers,
      web3.js) works unmodified. The endpoint is public and unauthenticated; there is no API key, no OpenAPI
      description, and no published rate-limit contract.
    humanURL: https://docs.5ire.org/build-on-5irechain/evm-compatibility/
    baseURL: https://rpc.5ire.network
    tags:
      - Blockchain
      - Layer 1
      - EVM
      - JSON-RPC
      - Smart Contracts
      - Web3
    tags_raw:
      - blockchain
      - layer-1
      - evm
      - json-rpc
      - smart-contracts
      - web3
    properties:
      - type: Documentation
        url: https://docs.5ire.org/build-on-5irechain/build-on-5irechain/
      - type: GettingStarted
        url: https://docs.5ire.org/introduction-to-5irechain/
      - type: Explorer
        url: https://5irescan.io
      - type: ChainRegistry
        url: https://chainid.network/chain/995/
  - name: 5ireChain Thunder Testnet JSON-RPC
    description: >-
      Ethereum-compatible JSON-RPC 2.0 endpoint for the 5ireChain Thunder testnet (EIP-155 chain ID 997, native
      currency T5IRE). Paired with a public faucet and a separate testnet block explorer, this is 5ire's
      test-vs-live separation: the same contracts and Ethereum tooling target chain ID 997 with valueless test
      tokens before promotion to mainnet chain ID 995. Public and unauthenticated.
    humanURL: https://docs.5ire.org/wallets/metamask/
    baseURL: https://rpc.testnet.5ire.network
    tags:
      - Blockchain
      - Testnet
      - EVM
      - JSON-RPC
      - Sandbox
      - Web3
    tags_raw:
      - blockchain
      - testnet
      - evm
      - json-rpc
      - sandbox
      - web3
    properties:
      - type: Documentation
        url: https://docs.5ire.org/wallets/metamask/
      - type: Sandbox
        url: sandbox/5ire-sandbox.yml
      - type: Explorer
        url: https://testnet.5irescan.io
      - type: ChainRegistry
        url: https://chainid.network/chain/997/
  - name: 5ireChain Native (Substrate) RPC
    description: >-
      Substrate/Polkadot-SDK RPC surface of the 5ireChain node, reached over WebSocket (default port 9944) and
      consumed through the first-party @5ire/api JavaScript client, a fork of the Polkadot.js API. This is the
      native side of the chain used for WASM (ink!) smart contracts, staking, validator/nominator operations and
      the ESG consensus pallets, as opposed to the EVM machine exposed over Ethereum JSON-RPC.
    humanURL: https://docs.5ire.org/deploy-smart-contracts/native-chain-wasm/
    baseURL: https://rpc.5ire.network
    tags:
      - Blockchain
      - Substrate
      - Wasm
      - RPC
      - Staking
      - Web3
    tags_raw:
      - blockchain
      - substrate
      - wasm
      - rpc
      - staking
      - web3
    properties:
      - type: Documentation
        url: https://docs.5ire.org/deploy-smart-contracts/native-chain-wasm/
      - type: SourceCode
        url: https://github.com/5ire-tech/5ireChain
      - type: SDKs
        url: https://www.npmjs.com/package/@5ire/api
