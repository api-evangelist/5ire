aid: 5ire
name: 5ire
description: >-
  5ire (5ireChain) is a layer-1, EVM-compatible smart contract blockchain built on the Polkadot SDK (Substrate),
  founded in 2021 and headquartered in Dubai with engineering in India. The chain positions sustainability as a
  first-class protocol concern: its Sustainable Proof of Stake / "Proof of 5ire" consensus scores validators against
  ESG data so block production and rewards are weighted by environmental and social performance, aligned to the UN
  Sustainable Development Goals. Developers reach the network through a standard Ethereum JSON-RPC endpoint
  (mainnet chain ID 995, Thunder testnet chain ID 997) using MetaMask, Hardhat, Foundry, Remix, wagmi and Ganache,
  or through the native Substrate/WASM side of the chain via the Polkadot-derived @5ire/api JavaScript client.
  Supporting surfaces include the 5irescan block explorer, a testnet faucet, validator and nominator applications,
  the 5ire wallet browser extension, and a 5ire IDE for contract deployment. 5ire has raised roughly USD 121M and
  trades on secondary private markets; it publishes no OpenAPI, AsyncAPI, MCP server or A2A agent card.
